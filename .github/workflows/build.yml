yamlname: Build CreamInstaller

on:
  workflow_dispatch: # Allows you to run the build manually

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Adjust this to 6.0.x or 7.0.x if the fork uses an older framework

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build and Publish
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true -o ./publish

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: CreamInstaller-Build
        path: ./publish/
